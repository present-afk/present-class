<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <title>선물나라 학급 종합관리 시스템</title>
  <style>
    /* 기본 스타일 및 탭 구성 */
    body { font-family: Arial, sans-serif; margin: 20px; }
    .tab-menu { display: flex; border-bottom: 2px solid #ccc; margin-bottom: 20px; }
    .tab-button { padding: 10px 20px; cursor: pointer; border: none; background: #f1f1f1; font-size: 16px; margin-right: 5px; border-radius: 5px 5px 0 0; }
    .tab-button.active { background: #4CAF50; color: white; font-weight: bold; }
    .tab-content { display: none; }
    .tab-content.active { display: block; }

    /* 매점 카드 스타일 */
    .food-card { border: 1px solid #ddd; padding: 15px; margin: 10px 0; border-radius: 8px; width: 200px; display: inline-block; text-align: center; }
    .buy-btn { background-color: #2196F3; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; }

    /* 확인/취소 모달 팝업 스타일 */
    .modal-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); justify-content: center; align-items: center; }
    .modal-box { background: white; padding: 25px; border-radius: 10px; width: 300px; text-align: center; box-shadow: 0 4px 8px rgba(0,0,0,0.2); }
    .modal-btns { margin-top: 20px; display: flex; justify-content: space-around; }
    .confirm-btn { background-color: #4CAF50; color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; }
    .cancel-btn { background-color: #f44336; color: white; border: none; padding: 8px 20px; border-radius: 5px; cursor: pointer; }
  </style>
</head>
<body>

  <!-- 상단 탭 메뉴 -->
  <div class="tab-menu">
    <button class="tab-button active" onclick="openTab('store')">🛒 매점</button>
    <button class="tab-button" onclick="openTab('jobs')">📋 직업 수행도 (공개)</button>
  </div>

  <!-- 1. 매점 탭 내용 -->
  <div id="store" class="tab-content active">
    <h2>매점 음식 구매</h2>
    <div class="food-card">
      <h3>맛있는 과자</h3>
      <p>가격: 500 달란트</p>
      <button class="buy-btn" onclick="showPurchaseModal('맛있는 과자', 500)">구매하기</button>
    </div>
    <div class="food-card">
      <h3>시원한 음료수</h3>
      <p>가격: 700 달란트</p>
      <button class="buy-btn" onclick="showPurchaseModal('시원한 음료수', 700)">구매하기</button>
    </div>
  </div>

  <!-- 2. 직업 수행도 탭 내용 (누구나 확인 가능) -->
  <div id="jobs" class="tab-content">
    <h2>학급 직업 수행도 현황</h2>
    <table border="1" cellpadding="8" style="border-collapse: collapse; width: 100%; text-align: center;">
      <tr style="background-color: #f2f2f2;">
        <th>직업명</th>
        <th>담당 학생</th>
        <th>오늘의 수행 상태</th>
      </tr>
      <tr>
        <td>칠판 도우미</td>
        <td>김철수</td>
        <td>✅ 완료</td>
      </tr>
      <tr>
        <td>우유 도우미</td>
        <td>이영희</td>
        <td>⏳ 진행 중</td>
      </tr>
    </table>
  </div>

  <!-- 구매 확인/취소 모달 팝업 -->
  <div id="purchaseModal" class="modal-overlay">
    <div class="modal-box">
      <h3>구매 확인</h3>
      <p id="modalMessage">정말 구매하시겠습니까?</p>
      <div class="modal-btns">
        <button class="confirm-btn" onclick="processPurchase()">확인</button>
        <button class="cancel-btn" onclick="closeModal()">취소</button>
      </div>
    </div>
  </div>

  <script>
    // 탭 전환 함수
    function openTab(tabId) {
      document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
      document.querySelectorAll('.tab-button').forEach(btn => btn.classList.remove('active'));
      
      document.getElementById(tabId).classList.add('active');
      event.currentTarget.classList.add('active');
    }

    // 선택된 상품 정보 저장용 변수
    let selectedItem = null;

    // 구매 확인 모달 띄우기
    function showPurchaseModal(itemName, price) {
      selectedItem = { name: itemName, price: price };
      document.getElementById('modalMessage').innerText = `'${itemName}' (${price}달란트)을(를)\n구매하시겠습니까?`;
      document.getElementById('purchaseModal').style.display = 'flex';
    }

    // [취소] 버튼 클릭 시 모달 닫기
    function closeModal() {
      selectedItem = null;
      document.getElementById('purchaseModal').style.display = 'none';
    }

    // [확인] 버튼 클릭 시 최종 구매 처리
    function processPurchase() {
      if (selectedItem) {
        alert(`${selectedItem.name} 구매가 성공적으로 완료되었습니다!`);
        // TODO: 실제 서버 DB 연동 또는 포인트 차감 로직 실행
        closeModal();
      }
    }
  </script>

</body>
</html>
